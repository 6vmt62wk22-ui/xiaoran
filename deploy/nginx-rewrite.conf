# ===== TangWo 网盘 / tangwo-disk · Nginx 配置片段（放入你的 server {} 块）=====
# 适配 LNMP / 宝塔 / 1Panel。若部署在子目录（如 /tangwo-disk），把下方 ^/ 改为 ^/tangwo-disk/
# 目录结构：根=入口页；api/=接口；admin/=管理后台；pages/=法律静态页

# 1) 下载短链：/s/xxxx -> api/download.php?code=xxxx
location /s/ {
    rewrite ^/s/([a-zA-Z0-9]+)$ /api/download.php?code=$1 last;
}

# 2) 入口页（根目录）
location ~ ^/(dashboard|login|register|settings|logout|install)$ {
    rewrite ^/(.+)$ /$1.php last;
}

# 3) 管理后台（admin/）
location ~ ^/(dashboardadmin|dashboardadminusers|dashboardadminfiles|dashboardadminquotas|dashboardadminsystem|dashboardadminsettings|dashboardadminpricing|admin_overview|admin_users|admin_files|admin_quotas|admin_system|admin_settings|admin_pricing)$ {
    rewrite ^/(.+)$ /admin/$1.php last;
}

# 4) 接口（api/）
location ~ ^/(pre_upload|upload|delete|send_code|pay_create|pay_query|pay_notify|captcha)$ {
    rewrite ^/(.+)$ /api/$1.php last;
}

# 5) 法律/静态页（pages/）
location ~ ^/(privacy|terms|help|contact)$ {
    rewrite ^/(.+)$ /pages/$1.php last;
}

# 6) 上传目录：禁止执行 PHP（防 webshell）
location ~* ^/uploads/.*\.(php|phtml|php3|php4|php5|phar)$ {
    deny all;
}

# 7) 本机下载加速（X-Accel-Redirect）：仅 PHP 内部可触发，外部直接 404
#    对应 config.php 的 X_ACCEL_LOCATION('/_protected_files')；开启 X_ACCEL_REDIRECT 后生效。
location /_protected_files/ {
    internal;
    alias /var/www/tangwo-disk/uploads/;   # 改成你的项目 uploads 绝对路径
}

# 8) PHP 入口（按你现有 php-fpm 配置调整 sock 路径）
location ~ \.php$ {
    fastcgi_pass   unix:/run/php/php8.3-fpm.sock;   # 改成你的实际路径
    include        fastcgi_params;
    fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
}
