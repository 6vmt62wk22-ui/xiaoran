# ===== TangWo 多子域集群（同一份代码，按 NODE_ROLE 分工）=====
# 前置条件：
#   1) config.php：TICKET_COOKIE_DOMAIN = '.xcsc1.cn'（带前缀点，Cookie 跨子域共享）
#   2) config.php：AUTH_URL / APP_URL / IO_URL 填各子域绝对地址；NODE_ROLE 用环境变量覆盖
#   3) 四个子域 DNS 均解析到本机；四节点指向同一份代码根（ln -s 软链即可）
#   4) php-fpm 池配置需 clear_env = no（保证 getenv('XC_NODE_ROLE') 能被读到）
# 鉴权模型：auth 节点登录后签发 xc_ticket（HMAC 无状态票据，Cookie 域 .xcsc1.cn）
#           其余节点凭 Cookie 校验，无需共享 session —— 节点可独立横向扩展
# 节点职责：auth=登录注册登出 | app=前端控制台 | io=上传预检删除 | dl=下载
# 目录结构：根=入口页；api/=接口；admin/=管理后台；pages/=法律静态页

# ---------- auth：登录 / 注册 / 登出 / 安装 ----------
server {
    listen 443 ssl; server_name auth.xcsc1.cn;
    root /var/www/tangwo-disk;
    client_max_body_size 8m;   # 登录类不需大上传

    location / { try_files $uri $uri/ /index.php?$query_string; }

    # 注册验证码发送（邮箱/短信收码，归属 auth 节点）
    location ~ ^/(send_code|captcha)$ { rewrite ^/(.+)$ /api/$1.php last; }

    # 本节点只处理登录类，其余动作一律拒绝（防越权写）
    location ~ ^/(dashboard|settings|upload|pre_upload|delete|s/|install\.php|update\.php) { return 444; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # 改成实际 sock
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param XC_NODE_ROLE auth;
    }
}

# ---------- app：前端 / 控制台 ----------
server {
    listen 443 ssl; server_name app.xcsc1.cn;
    root /var/www/tangwo-disk;

    # 写/登录类动作禁止在 app 节点处理（应走 auth / io / dl 子域）
    location ~ ^/(login|register|logout|pre_upload|upload|delete|install|update) { return 444; }

    # 入口页（根）
    location ~ ^/(dashboard|settings)$ { rewrite ^/(.+)$ /$1.php last; }
    # 管理后台（admin/）
    location ~ ^/(dashboardadmin|dashboardadminusers|dashboardadminfiles|dashboardadminquotas|dashboardadminsystem|dashboardadminsettings|dashboardadminpricing|admin_overview|admin_users|admin_files|admin_quotas|admin_system|admin_settings|admin_pricing)$ { rewrite ^/(.+)$ /admin/$1.php last; }
    # 接口（api/）—— app 节点仅放行支付类
    location ~ ^/(pay_create|pay_query|pay_notify)$ { rewrite ^/(.+)$ /api/$1.php last; }
    # 法律页（pages/）
    location ~ ^/(privacy|terms|help|contact)$ { rewrite ^/(.+)$ /pages/$1.php last; }
    # 控制台内直接下载
    location /s/ { rewrite ^/s/([a-zA-Z0-9]+)$ /api/download.php?code=$1 last; }

    # 本机下载加速（X-Accel-Redirect）：仅 PHP 内部可触发，外部直接访问 404
    location ^~ /_protected_files/ {
        internal;
        alias /var/www/tangwo-disk/uploads/;   # 改成你的 uploads 绝对路径
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param XC_NODE_ROLE app;
    }
}

# ---------- io：上传 / 预检 / 删除 ----------
server {
    listen 443 ssl; server_name io.xcsc1.cn;
    root /var/www/tangwo-disk;
    client_max_body_size 2048m;   # 大文件上传

    # 仅暴露上传 / 预检 / 删除接口，其余拒绝
    location ~ ^/(upload|pre_upload|delete)$ { rewrite ^/(.+)$ /api/$1.php last; }
    location / { return 444; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param XC_NODE_ROLE io;
    }
}

# ---------- dl：下载 ----------
server {
    listen 443 ssl; server_name dl.xcsc1.cn;
    root /var/www/tangwo-disk;

    # 下载短链
    location /s/ { rewrite ^/s/([a-zA-Z0-9]+)$ /api/download.php?code=$1 last; }
    # 本机 X-Accel 内部路径（仅 PHP 可触发，外部直接访问 404）
    location ^~ /_protected_files/ {
        internal;
        alias /var/www/tangwo-disk/uploads/;   # 改成你的 uploads 绝对路径
    }
    location / { return 444; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param XC_NODE_ROLE dl;
    }
}

# SSL 证书（示例，按需替换）
